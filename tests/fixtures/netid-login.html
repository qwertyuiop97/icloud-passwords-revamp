<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebAuth fixture</title>
</head>
<body>
  <form id="login" action="#" method="post">
    <label>NetID <input id="netid" name="username" type="text" placeholder="NetID" autocomplete="username"></label>
    <label>Password <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
